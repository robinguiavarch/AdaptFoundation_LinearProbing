# Classification Configuration for AdaptFoundation Project - CONCATENATION STRATEGY
# Giant Model Testing: dinov2_vitg14 Only for High-Dimensional Evaluation
# ================================================================================

# Foundation Model to Evaluate (Giant Model - Highest Dimensions)
models:
  - dinov2_vitg14    # Giant: 1536D per slice → up to 138240D (multi-axes concatenation)

# Concatenation Feature Configurations to Test
configurations:
  - multi_axes_concatenation           # Primary concatenation configuration
  - single_axis_axial_concatenation    # Individual axis analysis with concatenation
  - single_axis_coronal_concatenation  # Individual axis analysis with concatenation
  - single_axis_sagittal_concatenation # Individual axis analysis with concatenation

# Classifiers to Evaluate
classifiers:
  - logistic             # Primary focus (best for neuroimaging)
  - knn                  # Comparison baseline
  - svm_linear           # Comparison baseline

# PCA Dimensionality Reduction Modes (including extreme original dimensions)
pca_modes:
  - 32                   # PCA 32D (Champollion V1 comparison)
  - 95                   # PCA 95% variance (adaptive)
  - 256                  # PCA 256D (Champollion V0 comparison)
  - none                 # Original features (EXTREME: up to 138K dimensions!)

# Execution Configuration
execution:
  parallel_models: false          # Only one model anyway
  parallel_configs: false         # Sequential for stability with giant model
  focus_mode: false               # Run all combinations
  
  # Priority combinations for ultra-quick testing
  focus_combinations:
    model: "dinov2_vitg14"
    config: "multi_axes_concatenation"
    classifier: "logistic"
    pca_mode: "32"

# Output Configuration (Concatenation Path)
output:
  base_path: "feature_extracted_concat"
  save_consolidated: true         # Save consolidated results
  save_individual: true          # Save per-config results
  
# Validation and Quality Control
validation:
  check_pca_availability: true    # Verify PCA files exist before running
  check_feature_files: true      # Verify feature files exist
  skip_existing: false           # Re-run even if results exist
  
# Classifier Parameters (Optimized for VERY High-Dimensional Concatenation Features)
classifier_params:
  logistic:
    max_iter: 100000             # Very high for 138K dimensional concatenation features
    solver: 'saga'               # Best for elasticnet penalty
    penalty: 'elasticnet'        # L1 + L2 regularization crucial for vitg14
    random_state: 42
  
  knn:
    n_jobs: -1                   # Use all available cores
    n_neighbors: [1, 3, 5, 7, 9, 11, 13, 15]
    leaf_size: [1, 5, 10, 20, 30]
    weights: ['uniform', 'distance']
    metric: ['minkowski', 'manhattan', 'cosine']
  
  svm_linear:
    max_iter: 1000              # Very high for giant model concatenation features
    random_state: 42
    C_values: [0.001, 0.01, 0.1, 1.0, 10.0, 100.0, 1000.0]
    class_weight: [null, 'balanced']
    loss: ['hinge', 'squared_hinge']

# Reporting
reporting:
  verbose: true                   # Detailed progress output
  save_timing: true              # Track execution times
  save_diagnostics: true        # Include overfitting/convergence diagnostics

# Expected Dimensions for vitg14 (Documentation)
expected_dimensions:
  dinov2_vitg14:   # 1536D per slice - HIGHEST DIMENSIONS
    multi_axes_concatenation: 138240          # (22+38+30) × 1536D = 90 × 1536D
    single_axis_axial_concatenation: 33792    # 22 × 1536D
    single_axis_coronal_concatenation: 58368  # 38 × 1536D
    single_axis_sagittal_concatenation: 46080 # 30 × 1536D

# Processing Plan Summary
processing_summary:
  total_combinations: 48          # 1 model × 4 configs × 3 classifiers × 4 PCA modes (including none)
  estimated_time: "6-12 hours"    # Conservative estimate including extreme dimensions
  purpose: "Test concatenation strategy with largest foundation model + extreme dimensions"
  
# Notes for Giant Model Testing
notes:
  strategy: "Evaluate concatenation performance with highest-dimensional model"
  memory_requirements: "EXTREMELY HIGH - vitg14 concatenation reaches 138K dimensions WITHOUT PCA"
  pca_necessity: "Original dimensions (138K) will test hardware limits - may cause OOM"
  performance_expectations: "Longest computation time due to extreme dimensionality, some may fail"
  cluster_recommendations: "Use highest-memory nodes with extended time allocation"
  comparison_value: "Critical for understanding scaling behavior + hardware limits of concatenation"
  risk_warning: "Mode 'none' may cause Out-of-Memory errors - that's part of the experiment"