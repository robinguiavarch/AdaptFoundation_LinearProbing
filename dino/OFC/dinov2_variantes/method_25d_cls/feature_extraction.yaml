# Feature Extraction Configuration for 2.5D CLS Token Variants with Classical PCA
# =================================================================================

# Dataset Configuration
dataset:
  name: "HCP_OFC"
  data_path: "crops/2mm/S.Or."
  resolution: "2mm"
  target_task: "Left_OFC_classification"
  n_classes: 4

# Foundation Model Configuration (DINOv2 Giant)
model:
  name: "dinov2_vitg14"
  feature_dimension: 1536
  input_size: 224
  batch_size: 8
  device: "auto"

# PCA Configuration (Applied Immediately with Classical PCA)
pca_modes:
  - mode: "fixed"
    n_components: 32
    description: "PCA 32D (Champollion V1 comparison)"
    
  - mode: "fixed"
    n_components: 256
    description: "PCA 256D (Champollion V0 comparison)"
    
  - mode: "variance"
    variance_threshold: 0.99
    description: "PCA 99% variance (adaptive dimensionality)"

# Output Configuration
output:
  base_path: "dinov2_variantes/method_25d_cls/method_25d_cls_features"
  structure: "{variant_name}/PCA_{pca_mode}/"
  file_format:
    features: "npy"
    metadata: "csv"
    config_info: "json"

# 2.5D CLS Token Configurations
configurations:
  - name: "concat_baseline"
    description: "Concatenation with standard slicing (slice replication)"
    aggregation_method: "concat"
    method: "standard_slicing"

  - name: "concat_25d_no_overlap"
    description: "Concatenation with 2.5D non-overlapping grouping"
    aggregation_method: "concat"
    method: "adaptive_25d"

  - name: "concat_25d_overlap"
    description: "Concatenation with 2.5D overlapping grouping"
    aggregation_method: "concat"
    method: "overlapping_25d"

  - name: "pooling_baseline"
    description: "Average pooling with standard slicing (slice replication)"
    aggregation_method: "pooling"
    method: "standard_slicing"

  - name: "pooling_25d_no_overlap"
    description: "Average pooling with 2.5D non-overlapping grouping"
    aggregation_method: "pooling"
    method: "adaptive_25d"

  - name: "pooling_25d_overlap"
    description: "Average pooling with 2.5D overlapping grouping"
    aggregation_method: "pooling"
    method: "overlapping_25d"

# Processing Configuration (Memory Optimized)
processing:
  classical_pca: true
  save_raw_features: false
  progress_tracking: true
  validation_enabled: true
  memory_optimization: true
  
  # Memory optimization parameters
  subject_batch_size: 1
  training_sample_size: 500
  cleanup_aggressive: true

# Slicing Configuration
slicing:
  target_size: 224
  normalization: "imagenet"
  interpolation: "nearest"

# Validation Configuration
validation:
  check_file_integrity: true
  verify_dimensions: true
  validate_cls_tokens: true
  required_files:
    - "metadata.json"
    - "test_split_features.npy"
    - "test_split_metadata.csv"
    - "train_val_split_0_features.npy"
    - "train_val_split_0_metadata.csv"
    - "train_val_split_1_features.npy"
    - "train_val_split_1_metadata.csv"
    - "train_val_split_2_features.npy"
    - "train_val_split_2_metadata.csv"
    - "train_val_split_3_features.npy"
    - "train_val_split_3_metadata.csv"
    - "train_val_split_4_features.npy"
    - "train_val_split_4_metadata.csv"

# Expected Raw Dimensions Before PCA (CLS Token Based)
expected_raw_dimensions:
  dinov2_vitg14:
    cls_token_dim: 1536
    
    baseline_slicing:
      sagittal_tokens: 30
      coronal_tokens: 38
      axial_tokens: 22
      total_tokens: 90
    
    non_overlapping_25d:
      sagittal_groups: 10
      coronal_groups: 12
      axial_groups: 7
      total_groups: 29
    
    overlapping_25d:
      sagittal_groups: 28
      coronal_groups: 36
      axial_groups: 20
      total_groups: 84

    final_raw_dimensions:
      concat_baseline: 138240
      concat_25d_no_overlap: 44544
      concat_25d_overlap: 129024
      pooling_all_variants: 4608

# Final Output Dimensions After Classical PCA
expected_final_dimensions:
  after_pca_32: 32
  after_pca_256: 256
  after_pca_99: "Variable"

# Memory Usage Estimates (CLS Token Based - Much Lower)
memory_estimates:
  max_subject_memory:
    concat_baseline: "0.5 MB"
    concat_25d_overlap: "0.5 MB"
    pooling_all_variants: "0.02 MB"
  
  batch_memory_pca:
    concat_baseline_461_subjects: "0.24 GB"
    concat_25d_overlap_461_subjects: "0.23 GB"
    pooling_461_subjects: "0.01 GB"
  
  total_storage_after_pca:
    all_variants_all_modes: "5-15 MB"

# Notes
notes:
  cls_tokens: "Uses CLS token instead of feature maps for global representation"
  method_25d: "Groups 3 consecutive slices in RGB channels with overlapping support"
  classical_pca: "Classical PCA fitted on ALL 461 subjects from 5 train/val folds"
  memory_optimization: "CLS tokens require significantly less memory than feature maps"
  total_configurations: 18
  key_innovation: "Memory-efficient CLS token pipeline with 2.5D overlapping variants"
  compatibility: "Fully compatible with Linear Probing"
  overlapping_advantage: "Maximizes spatial continuity and data augmentation"

# Performance Expectations
performance:
  estimated_runtime: "30-60 minutes for all 18 configurations"
  peak_memory_usage: "< 2 GB RAM (CLS token advantage)"
  storage_requirements: "< 20 MB total"
  bottleneck: "CLS token extraction (lighter than feature maps)"
  pca_advantage: "Classical PCA much faster with CLS tokens"
  pca_subjects: "All 461 subjects from 5 train/val folds used for PCA fitting"
  