# Feature Extraction Configuration for F.I.P. Feature Maps and 2.5D Variants
# ===========================================================================

# Dataset Configuration
dataset:
  name: "HCP_FIP"
  data_path: "crops/2mm/F.I.P./"
  resolution: "2mm"
  target_task: "Right_FIP_classification"
  n_classes: 2

# Foundation Model Configuration (DINOv2 Giant)
model:
  name: "dinov2_vitg14"
  feature_dimension: 1536
  input_size: 224
  batch_size: 4
  device: "auto"

# PCA Configuration (Applied by Pipeline 2)
pca_modes:
  - mode: "fixed"
    n_components: 32
    description: "PCA 32D (Champollion V1 comparison)"
    
  - mode: "fixed"
    n_components: 256
    description: "PCA 256D (Champollion V0 comparison)"
    
  - mode: "variance"
    variance_threshold: 0.95
    description: "PCA 95% variance (adaptive dimensionality)"

  - mode: "variance"
    variance_threshold: 0.99
    description: "PCA 99% variance (high preservation)"

# Output Configuration
output:
  base_path: "feature_extracted_fip_dinov2"
  structure: "{variant_name}/{pca_mode}/"
  file_format:
    features: "npy"
    metadata: "csv"
    config_info: "json"

# Feature Maps and 2.5D Configurations (Pooling Only)
configurations:
  - name: "pooling_spatial_without_25d"
    description: "Spatial pooling with standard slicing"
    aggregation_method: "pooling"
    use_25d_method: false

  - name: "pooling_spatial_with_25d"
    description: "Spatial pooling with 2.5D overlapping slicing"
    aggregation_method: "pooling"
    use_25d_method: true

# Processing Configuration (Pipeline Separation)
processing:
  # Pipeline 1 settings
  raw_features_only: true          # Pipeline 1: Save raw features only
  save_pca_features: false         # Pipeline 1: No PCA
  
  # Pipeline 2 settings  
  classical_pca: true              # Pipeline 2: Use Classical PCA
  load_from_raw: true              # Pipeline 2: Load from raw_features/
  
  # Common settings
  progress_tracking: true
  validation_enabled: true
  memory_optimization: true
  
  # Memory optimization parameters
  subject_batch_size: 1            # Process 1 subject at a time
  training_sample_size: 500        # Use all 313 subjects from 5 train/val folds
  cleanup_aggressive: true         # Aggressive memory cleanup

# Slicing Configuration for F.I.P.
slicing:
  target_size: 224
  normalization: "imagenet"
  interpolation: "nearest"
  
  # Standard slicing dimensions
  standard_slicing:
    sagittal_slices: 39            # X axis
    coronal_slices: 45             # Y axis
    axial_slices: 44               # Z axis
    total_slices: 128              # 39+45+44
  
  # 2.5D overlapping with step=2
  adaptive_grouping_25d:
    sagittal_groups: 37            # Overlapping step=2: [0,1,2], [2,3,4], ..., [36,37,38]
    coronal_groups: 43             # Overlapping step=2: [0,1,2], [2,3,4], ..., [42,43,44]
    axial_groups: 42               # Overlapping step=2: [0,1,2], [2,3,4], ..., [40,41,42]
    total_groups: 122              # 37+43+42
    overlapping_step: 2            # Step size for overlapping

# Validation Configuration
validation:
  check_file_integrity: true
  verify_dimensions: true
  validate_feature_maps: true
  required_files:
    - "metadata.json"
    - "test_split_features.npy"
    - "test_split_metadata.csv"
    - "train_val_split_0_features.npy"
    - "train_val_split_0_metadata.csv"
    - "train_val_split_1_features.npy"
    - "train_val_split_1_metadata.csv"
    - "train_val_split_2_features.npy"
    - "train_val_split_2_metadata.csv"
    - "train_val_split_3_features.npy"
    - "train_val_split_3_metadata.csv"
    - "train_val_split_4_features.npy"
    - "train_val_split_4_metadata.csv"

# Expected Raw Dimensions Before PCA (16x16 PATCHES - DINOv2 Giant)
expected_raw_dimensions:
  dinov2_vitg14:
    feature_maps_per_slice: 256          # 16×16 patches
    feature_dim_per_patch: 1536          # Giant model dimension
    
    standard_slicing:
      sagittal_slices: 39                # X axis
      coronal_slices: 45                 # Y axis  
      axial_slices: 44                   # Z axis
      total_slices: 128                  # 39+45+44
    
    adaptive_25d_slicing:
      sagittal_groups: 37                # Overlapping groups
      coronal_groups: 43                 # Overlapping groups
      axial_groups: 42                   # Overlapping groups
      total_groups: 122                  # 37+43+42

    final_raw_dimensions:
      pooling_without_25d: 393216        # 256 × 1536 (~393K)
      pooling_with_25d: 393216           # 256 × 1536 (~393K) - same for pooling

# Final Output Dimensions After PCA
expected_final_dimensions:
  after_pca_32: 32                       # Fixed 32 components
  after_pca_256: 256                     # Fixed 256 components  
  after_pca_95: "Variable (estimated 1000-2000)"    # Depends on variance threshold
  after_pca_99: "Variable (estimated 2000-3000)"    # Depends on variance threshold

# Memory Usage Estimates (DINOv2 Giant + 313 F.I.P. subjects)
memory_estimates:
  max_subject_memory:
    pooling_variants: "1.5 MB"          # Single subject raw features (393K × 4 bytes)
  
  batch_memory_pca:
    pooling_313_subjects: "0.47 GB"     # 313 × 1.5MB for PCA fitting
  
  total_storage_after_pca:
    all_variants_all_modes: "15-25 MB"  # All 8 configurations combined

# Notes
notes:
  feature_maps: "Uses 16×16 spatial patches with pooling aggregation only"
  method_25d: "Groups 3 consecutive slices with overlapping step=2"
  overlapping_advantage: "Provides more spatial context vs standard grouping"
  classical_pca: "Classical PCA fitted on ALL 313 subjects from 5 train/val folds"
  memory_optimization: "Pipeline separation for optimal performance"
  total_configurations: 8              # 2 variants × 4 PCA modes
  key_innovation: "F.I.P. adapted pipeline with overlapping 2.5D and PCA_99"
  compatibility: "Fully compatible with Linear Probing"
  pipeline_separation: "Pipeline 1 (extraction) + Pipeline 2 (PCA)"

# Performance Expectations
performance:
  pipeline_1_runtime: "12-15 minutes (2 variants raw extraction)"  
  pipeline_2_runtime: "2-3 minutes (8 PCA tasks)"
  total_runtime: "14-18 minutes vs 35+ min with fusion"
  speedup_factor: "2.5x faster than fusion approach"
  peak_memory_usage: "< 3 GB RAM (pooling advantage)"
  storage_requirements: "< 50 MB total"
  bottleneck: "Feature map extraction (DINOv2 Giant forward passes)"
  pca_subjects: "All 313 subjects from 5 train/val folds used for PCA fitting"

# F.I.P. Dataset Specifics
fip_dataset_info:
  volume_shape: [39, 45, 44]            # F.I.P. specific dimensions
  hemisphere: "Right"                   # Right hemisphere analysis
  task_type: "Binary classification"    # 0/1 labels
  subjects_total: 1114                  # Total subjects in dataset
  subjects_labeled: 390                 # Subjects with Right_FIP labels
  subjects_splits:
    train_val_folds: 313                # Subjects across 5 train/val folds
    test_split: 77                      # Subjects in test split
  class_distribution:                   # From validation results
    absent: 101                         # Class 0 (Right_FIP = 0)
    present: 289                        # Class 1 (Right_FIP = 1)
  density_average: "2.77%"              # Average voxel density

# Innovation Highlights
innovation_highlights:
  overlapping_25d: "Step=2 overlapping provides richer spatial context"
  pca_99_mode: "99% variance preservation for maximum information retention"
  pipeline_separation: "Optimized execution time with flexible PCA experimentation"
  fip_adaptation: "Tailored to F.I.P. dataset dimensions and binary classification"
  pooling_focus: "Concentrated on most effective aggregation method"
  giant_model: "Leverages DINOv2 Giant (1536D) for maximum representation power"