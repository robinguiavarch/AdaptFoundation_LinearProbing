# Data configuration
data:
  dataset_path: "crops/2mm/S.Or."
  output_base_path: "feature_extraction_point_m2ae_cfgs"

# Hardware configuration
hardware:
  gpu_memory_gb: 40
  cpu_cores: 32

# Validation settings
validation:
  check_input_size: true
  validate_features: true
  validate_preprocessing: true
  expected_preprocessing_outputs: 3
  expected_final_dims:
    A1: 384
    A2: 1536
    A3: 576
    A4: 384
    A5: 384

# Configuration notes
notes:
  preprocessing: "Fixed normalization: center (15,19,11) + [-1,1] distribution"
  modifiable_params: "num_groups, group_sizes, local_radius"
  fixed_params: "encoder_depths, encoder_dims, drop_path_rate, num_heads"
  total_configurations: 50