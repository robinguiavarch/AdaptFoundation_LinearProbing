# Point-M2AE Feature Extraction Configuration with 50 Configurations
# AdaptFoundation Project - Hierarchical point cloud feature extraction optimization

# Model configuration
model:
  name: "point_m2ae_encoder"
  type: "hierarchical_encoder"
  checkpoint_path: "point_m2ae/ckpt/pre-train.pth"

# Point-M2AE processing configuration - Fixed parameters
processing:
  # Model architecture (FIXED - tied to pre-trained weights)
  encoder_depths: [5, 5, 5]
  encoder_dims: [96, 192, 384]
  drop_path_rate: 0.1
  num_heads: 6
  
  # Runtime configuration
  batch_size: 1
  device: "cuda"
  
  # 10 configurations of modifiable parameters
  configs:
    C1:
      num_groups: [512, 256, 64]
      group_sizes: [16, 8, 8]
      local_radius: [0.32, 0.64, 1.28]
      strategy: "Baseline standard"
    
    C2:
      num_groups: [150, 75, 25]
      group_sizes: [16, 8, 8]
      local_radius: [0.32, 0.64, 1.28]
      strategy: "Conservative num_groups reduction"
    
    C3:
      num_groups: [512, 256, 64]
      group_sizes: [8, 6, 4]
      local_radius: [0.32, 0.64, 1.28]
      strategy: "Conservative group_sizes reduction"
    
    C4:
      num_groups: [512, 256, 64]
      group_sizes: [16, 8, 8]
      local_radius: [0.1, 0.2, 0.4]
      strategy: "Conservative local_radius reduction"
    
    C5:
      num_groups: [100, 50, 20]
      group_sizes: [8, 6, 4]
      local_radius: [0.32, 0.64, 1.28]
      strategy: "Combined density + connectivity"
    
    C6:
      num_groups: [150, 75, 25]
      group_sizes: [16, 8, 8]
      local_radius: [0.1, 0.2, 0.4]
      strategy: "Combined density + granularity"
    
    C7:
      num_groups: [512, 256, 64]
      group_sizes: [8, 6, 4]
      local_radius: [0.1, 0.2, 0.4]
      strategy: "Combined connectivity + granularity"
    
    C8:
      num_groups: [80, 40, 15]
      group_sizes: [6, 4, 4]
      local_radius: [0.05, 0.1, 0.2]
      strategy: "Aggressive sparse-optimized"
    
    C9:
      num_groups: [120, 60, 20]
      group_sizes: [8, 6, 4]
      local_radius: [0.1, 0.2, 0.4]
      strategy: "Optimal theoretical balance"
    
    C10:
      num_groups: [100, 50, 20]
      group_sizes: [6, 4, 4]
      local_radius: [0.05, 0.1, 0.15]
      strategy: "Ultra-fine detection"

# Aggregation methods
aggregation_methods:
  A1:
    name: "mean"
    description: "Baseline mean pooling"
    output_dim: 384
  
  A2:
    name: "mean_std_min_max"
    description: "Enhanced statistics (mean+std+min+max)"
    output_dim: 1536
  
  A3:
    name: "multi_level"
    description: "Multi-level aggregation (levels 2+3)"
    output_dim: 576
  
  A4:
    name: "adaptive"
    description: "Variance-based adaptive pooling"
    output_dim: 384
  
  A5:
    name: "attention"
    description: "Attention-weighted pooling"
    output_dim: 384

# 50 complete configurations (10 configs × 5 aggregations)
